spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true # 알 수 없는 속성이 있으면 실패(에러) 처리

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:mysql://localhost:3306/modernworld
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  jwt:
    access-secret:
      supersecretsecretsecretsecretsecretsupersecretsecretsecretsecretsecretsupersecretsecretsecretsecretsecret
    refresh-secret:
      secretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecret
    access-expiration: 10_800_000 # 3h
    refresh-expiration: 604_800_000 # 7d
    issuer: Eomjunsick.com
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # SQL 쿼리를 표준 출력(console) 에 출력
    properties:
      hibernate:
        format_sql: true # 출력되는 SQL 쿼리를 가독성 좋게 포맷

  devtools:
    restart:
      enabled: false

naver:
  client:
    id: pYRBf_gt4ONiKuhNJiLJ # 테스트용
    secret: 2pIqMHnlsL # 테스트용
    callback-url: https://localhost:8080/naver/auth/callback

